[project]
name = "devtemplate"
version = "0.2.0"
description = "Layered, dev-style named devcontainer templates, built and run directly via Docker or Podman"
requires-python = ">=3.12,<3.15"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "platformdirs>=4.0",
    "httpx>=0.27",
    "jsonschema>=4.18",
    "docker>=7.0",
    "asyncssh>=2.14",
    "pywinpty>=2.0,<4; sys_platform == \"win32\"",
    "logerr[retry] @ git+https://github.com/jesserobertson/logerr.git@cbd89bd61c7f3a2abc3f32619f0f10fb5ef1c8a8",
]

[project.scripts]
dvt = "devtemplate.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devtemplate"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests", "src/devtemplate"]
addopts = "--cov=devtemplate --cov-report=term-missing --doctest-modules -m \"not integration\""
doctest_optionflags = ["ELLIPSIS", "NORMALIZE_WHITESPACE"]
asyncio_mode = "auto"
markers = [
    "unit: fast, fully mocked tests (auto-applied by default, see conftest.py)",
    "integration: tests that exercise a real container runtime/network call",
    "slow: tests that take noticeably longer than the rest of the suite",
    "network: tests that require real network access",
]

[tool.coverage.run]
source = ["src/devtemplate"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
implicit_reexport = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# pywinpty ships no py.typed marker and no stubs, and is a win32-only
# dependency so it isn't even installed on the Linux/macOS CI runners.
[[tool.mypy.overrides]]
module = "winpty.*"
ignore_missing_imports = true

# typeshed guards fcntl/termios/pty and os's W*() helpers behind
# `sys.platform != "win32"`, so the attr-defined ignores this module needs on
# CI's windows-latest runner are unused on the Linux/macOS ones. Scoped to
# that single warning rather than disabling attr-defined outright, so genuine
# typos in the module are still caught on every platform.
[[tool.mypy.overrides]]
module = "devtemplate.pty.posix"
warn_unused_ignores = false

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64"]

[tool.pixi.pypi-dependencies]
devtemplate = { path = ".", editable = true }

[tool.pixi.dependencies]
python = ">=3.12,<3.15"

[tool.pixi.feature.dev.dependencies]
pytest = ">=8.0"
hypothesis = ">=6.100"
pytest-cov = ">=5.0"
pytest-asyncio = ">=0.24"
ruff = ">=0.15.22,<0.16"

[tool.pixi.feature.docs.dependencies]
mkdocs = "1.6.*"
mkdocs-material = "9.7.*"
mkdocstrings = "1.0.*"
mkdocstrings-python = "2.0.*"

[tool.pixi.environments]
default = { features = ["dev", "docs"], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
runtime = { solve-group = "default" }

[tool.pixi.tasks]
quality = { cmd = "python scripts/quality.py", description = "Code quality management (lint, format, typecheck)" }
test = { cmd = "python scripts/test.py", description = "Testing management (unit, integration, fast, all)" }
docs = { cmd = "python scripts/docs.py", description = "Documentation management (serve, build, status)" }
check-all = { cmd = "python scripts/test.py all && python scripts/quality.py check", description = "Run comprehensive checks (all tests + quality)" }
clean = { cmd = "python scripts/test.py clean && python scripts/docs.py clean", description = "Clean all project artifacts (test, docs)" }

[dependency-groups]
dev = ["mypy>=2.3.0,<3", "types-jsonschema>=4.26.0.20260518,<5", "types-docker>=7.0"]
