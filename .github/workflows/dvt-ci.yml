name: dvt CI

on:
  push:
    branches: [main]
    paths:
      - "dvt/**"
      - ".github/workflows/dvt-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "dvt/**"
      - ".github/workflows/dvt-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: dvt
    env:
      OS: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          manifest-path: dvt/pyproject.toml
          environments: dev

      - name: Run quality checks
        run: pixi run -e dev quality check

      - name: Run tests
        run: pixi run -e dev test all

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          files: dvt/coverage.xml
          env_vars: OS
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: dvt/junit.xml
          report_type: test_results
          flags: ${{ matrix.os }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dvt
    steps:
      - uses: actions/checkout@v7

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          manifest-path: dvt/pyproject.toml
          environments: docs

      - name: Build docs
        run: pixi run -e docs docs build --strict
