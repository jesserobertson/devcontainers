name: Build and push base images

on:
  push:
    branches: [main]
    paths:
      - base/Dockerfile
      - images/**
      - features/homebrew/**
      - features/shell-kit/**
      - features/pixi/**
      - .github/workflows/build.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-slim:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: base-ubuntu-slim
            base_image: ubuntu:24.04
            tags: ghcr.io/jesserobertson/base-ubuntu-slim:latest
          - name: base-cuda-slim
            base_image: nvidia/cuda:12.8.0-devel-ubuntu24.04
            tags: ghcr.io/jesserobertson/base-cuda-slim:latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: base
          target: slim
          push: true
          build-args: BASE_IMAGE=${{ matrix.base_image }}
          tags: ${{ matrix.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  build-bundles:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: build-slim
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: base-ubuntu
            tags: |
              ghcr.io/jesserobertson/base-ubuntu:latest
          - name: base-cuda
            tags: |
              ghcr.io/jesserobertson/base-cuda:latest
              ghcr.io/jesserobertson/base-cuda:cuda12.8.0
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: npm install -g @devcontainers/cli
      - name: devcontainer build ${{ matrix.name }}
        run: |
          image_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && image_args+=(--image-name "$tag")
          done <<< "${{ matrix.tags }}"
          devcontainer build \
            --workspace-folder "images/${{ matrix.name }}" \
            --push true \
            "${image_args[@]}"
